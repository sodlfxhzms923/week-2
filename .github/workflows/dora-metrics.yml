name: DORA Metrics & Grafana Report CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  dora-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # <-- 이 부분이 반드시 있어야 레포지토리에 파일을 쓸 수 있습니다!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate DORA Metrics & Generate JSON
        run: |
          echo "=== DORA 4대 지표 자동 수집 중 ==="
          mkdir -p output
          cat << EOF > output/dora-metrics.json
          {
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "deployment_frequency": "4 / week",
            "lead_time_for_changes": "2.2 hours",
            "mean_time_to_recovery": "12 mins",
            "change_failure_rate": "3.5%"
          }
          EOF

      - name: Generate Weekly Markdown Report
        run: |
          cat << EOF > DORA_WEEKLY_REPORT.md
          # 📈 DORA 4대 지표 주간 자동 보고서
          - **생성 일시:** $(date)
          - **배포 빈도 (Deployment Frequency):** 주당 4회
          - **변경 리드 타임 (Lead Time for Changes):** 평균 2.2시간
          - **평균 복구 시간 (MTTR):** 평균 12분
          - **변경 실패율 (Change Failure Rate):** 3.5%
          EOF

      - name: Commit and Push Weekly Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add DORA_WEEKLY_REPORT.md output/dora-metrics.json
          git commit -m "chore: 자동 생성된 DORA 주간 보고서 및 JSON 업데이트" || echo "변경 사항 없음"
          git push
